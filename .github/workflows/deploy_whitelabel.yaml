name: Deploy WhiteLabel

# The whitelabel sites are built and deployed by the whitelabel-deployment
# repository, which holds every site's Netlify id and its build configuration.
# This hands off to it rather than duplicating those secrets here.
on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger_deploy:
    name: Trigger the whitelabel deployment
    runs-on: [ubuntu-latest]
    steps:
      - name: Run the whitelabel repository's deploy and wait for it
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: appknox
          repo: whitelabel-deployment
          github_token: ${{ secrets.WHITELABEL_DEPLOYMENT_ACCESS_TOKEN }}
          workflow_file_name: deploy_react.yaml
