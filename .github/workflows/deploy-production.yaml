name: Deploy to production (Kubernetes)

# Temporary: triggers off this branch to match the Workload Identity
# Federation provider's attribute condition (repository + ref), set up for
# claude/k8s-deploy-base while this is being built out. Move both together
# once the real production trigger branch is decided.
on:
  push:
    branches:
      - claude/k8s-deploy-base

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  GHCR_CONTAINER: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.docker_tag.outputs.docker_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Get docker tag
        id: docker_tag
        run: echo "docker_tag=${GITHUB_REF##*/}_${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Docker Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download earthly
        run: "sudo /bin/sh -c 'wget https://github.com/earthly/earthly/releases/download/v0.8.15/earthly-linux-amd64 -O /usr/local/bin/earthly && chmod +x /usr/local/bin/earthly'"

      - name: Run build and publish to ghcr
        run: earthly --ci --push +publish --TAG=${{ steps.docker_tag.outputs.docker_tag }} --CONTAINER=${{ env.GHCR_CONTAINER }}

  deploy:
    name: Deploy to irene-react namespace
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://irene-react.productionalt.gcp.appknox.com
    steps:
      # Read-only access to the chart; this identity has no write access to
      # appknox/k8s and never pushes anything there. Sparse-checkout plus a
      # blobless partial clone keep every other app's chart — including
      # plaintext registry passwords and at least one private key file
      # elsewhere in that repo — off this runner entirely, not just unused.
      - name: Checkout the k8s chart repo
        uses: actions/checkout@v7
        with:
          repository: appknox/k8s
          # Temporary: the chart only exists on this branch so far. Switch to
          # the default branch (drop this `ref`) once it's merged.
          ref: add-irene-react-namespace-rbac
          token: ${{ secrets.K8S_REPO_READ_TOKEN }}
          path: k8s
          sparse-checkout: helm3/production/irene-react
          filter: blob:none

      # Keyless: exchanges this job's OIDC token for a short-lived GCP
      # credential, scoped to irene-react-deployer, which only has
      # roles/container.clusterViewer in GCP plus the irene-react namespace
      # Role/RoleBinding inside the cluster. No service account key exists.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/792654327264/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: irene-react-deployer@appknox-195110.iam.gserviceaccount.com

      - name: Set up gcloud and the GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get cluster credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: production-v2-2023-06
          location: us-central1-c
          project_id: appknox-195110

      - name: helm upgrade
        run: |
          helm upgrade --install irene-react k8s/helm3/production/irene-react \
            --namespace irene-react \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 5m

      - name: Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: repo,workflow
          custom_payload: |
            {
              attachments: [{
                color: '${{ job.status }}' === 'success' ? 'good' : '${{ job.status }}' === 'failure' ? 'danger' : 'warning',
                text: `Deploy to irene-react namespace (production) ${{ job.status }}: ${{ env.GHCR_CONTAINER }}:${{ needs.build-and-push.outputs.image_tag }}`,
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
