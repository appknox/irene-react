name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react:
    name: React app
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Application
        uses: ./.github/actions/setup-app

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm lint:types

      # The dashboard's own suite is sharded below; this covers the packages.
      - name: Test
        run: pnpm test:unit --filter=!@irene/dashboard

  react-test:
    name: React tests ${{ matrix.shard }}/4
    runs-on: [ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Application
        uses: ./.github/actions/setup-app

      # The suite imports from the workspace packages, which turbo builds for
      # the test task. Running vitest directly means building them here.
      - name: Build packages
        run: pnpm build

      # Each shard measures its own files; the blobs are merged afterwards, so
      # coverage is judged on the whole suite rather than a quarter of it.
      - name: Test
        working-directory: apps/dashboard
        run: pnpm test:shard --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: apps/dashboard/.vitest/blob/*
          retention-days: 1

  react-coverage:
    name: React coverage
    needs: [react-test]
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Application
        uses: ./.github/actions/setup-app

      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: apps/dashboard/.vitest/blob

      - name: Merge reports and check coverage
        working-directory: apps/dashboard
        run: pnpm test:merge

  ember-build:
    name: Build Ember app
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ember Application
        uses: ./.github/actions/setup-ember-app

      - name: Build
        working-directory: apps/irene
        run: npm run build:test

      # Built once here and reused, rather than rebuilt by every test partition.
      - uses: actions/upload-artifact@v7
        with:
          name: ember-dist
          path: apps/irene/dist
          retention-days: 1

  ember-lint:
    name: Lint Ember app
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ember Application
        uses: ./.github/actions/setup-ember-app

      # ember-cli-typescript reports type errors without failing the build, and
      # the app has no script of its own for this, so tsc is run directly.
      - name: Type check
        working-directory: apps/irene
        run: npx tsc --noEmit -p tsconfig.json

      # The Ember app lints with its own .eslintrc.js. ESLint 8 searches
      # ancestors for a flat config and would otherwise pick up the workspace's
      # eslint.config.js, whose dependencies this job does not install.
      - name: Lint
        working-directory: apps/irene
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npm run lint

  embed:
    name: Embed surface
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Application
        uses: ./.github/actions/setup-app

      - name: Build
        run: pnpm --filter @irene/dashboard build:embed

      # These cannot be expressed in the source, so they are asserted on the
      # output. Each one is a way the bundle silently fails inside a host page.
      - name: Check the bundle is safe to load in a host page
        working-directory: apps/dashboard/embed-dist
        run: |
          set -eu

          # Unlayered CSS beats layered CSS at any specificity, so a layer left
          # here loses to the host's own reset and the components draw unstyled.
          ! grep -q '@layer' style.css

          # Document rules must be confined, or they restyle the host's pages.
          grep -q '\[data-react-root\]' style.css

          # The element reset must stay global: a drawer or menu portals into
          # document.body, outside the mounted element.
          grep -qE '(^|\})button, *input' style.css

          # A host loads this with a script tag and reads what it leaves behind.
          grep -q '__ireneEmbed' embed.js

          # Configuration resolves at runtime, not frozen at build.
          grep -q '__IRENE_EMBED_CONFIG__' embed.js

          # Fonts emitted as files rather than inlined as base64.
          ls ./*.woff2 >/dev/null

  ember-test:
    name: Ember ${{ matrix.tests.type }}
    needs: [ember-build]
    runs-on: [ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        tests:
          - type: Unit Tests - Part 1
            commandArgs: --file-path='/irene/tests/unit*.js' --split=4 --partition=1 --parallel=4 --load-balance
          - type: Unit Tests - Part 2
            commandArgs: --file-path='/irene/tests/unit*.js' --split=4 --partition=2 --parallel=4 --load-balance
          - type: Unit Tests - Part 3
            commandArgs: --file-path='/irene/tests/unit*.js' --split=4 --partition=3 --parallel=4 --load-balance
          - type: Unit Tests - Part 4
            commandArgs: --file-path='/irene/tests/unit*.js' --split=4 --partition=4 --parallel=4 --load-balance
          - type: Acceptance Tests - Part 1
            commandArgs: --file-path='/irene/tests/acceptance*.js' --split=4 --partition=1 --parallel=4 --load-balance
          - type: Acceptance Tests - Part 2
            commandArgs: --file-path='/irene/tests/acceptance*.js' --split=4 --partition=2 --parallel=4 --load-balance
          - type: Acceptance Tests - Part 3
            commandArgs: --file-path='/irene/tests/acceptance*.js' --split=4 --partition=3 --parallel=4 --load-balance
          - type: Acceptance Tests - Part 4
            commandArgs: --file-path='/irene/tests/acceptance*.js' --split=4 --partition=4 --parallel=4 --load-balance
          - type: Integration Tests - Part 1
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=1 --parallel=12 --load-balance
          - type: Integration Tests - Part 2
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=2 --parallel=12 --load-balance
          - type: Integration Tests - Part 3
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=3 --parallel=12 --load-balance
          - type: Integration Tests - Part 4
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=4 --parallel=12 --load-balance
          - type: Integration Tests - Part 5
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=5 --parallel=12 --load-balance
          - type: Integration Tests - Part 6
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=6 --parallel=12 --load-balance
          - type: Integration Tests - Part 7
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=7 --parallel=12 --load-balance
          - type: Integration Tests - Part 8
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=8 --parallel=12 --load-balance
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ember Application
        uses: ./.github/actions/setup-ember-app

      - uses: actions/download-artifact@v8
        with:
          name: ember-dist
          path: apps/irene/dist

      # --wmmf writes the per-module metadata the summary below reads.
      - name: Test
        working-directory: apps/irene
        run: npm run test:ember -- ${{ matrix.tests.commandArgs }} --path=dist --wmmf

      - name: Job Summary
        if: always()
        working-directory: apps/irene
        run: |
          echo "| Module | Total | Passed | Failed | Skipped | Duration (ms) |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY

          cat module-metadata-*.json | jq -r '.modules[] | "\(.moduleName | gsub("\\|"; "\\\\|")) | \(.total) | \(.passed) | \(.failed) | \(.skipped) | \(.duration) "' >> $GITHUB_STEP_SUMMARY
