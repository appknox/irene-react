name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - master
      # Temporary: remove before merging this branch.
      - claude/k8s-deploy-base

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react:
    name: React app
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Application
        uses: ./.github/actions/setup-app

      - name: Lint JavaScript
        run: pnpm lint:js

      - name: Lint styles
        run: pnpm lint:css

      - name: Check formatting
        run: pnpm exec prettier --check "{apps/dashboard,packages}/**/*.{ts,tsx,js,jsx,json,css,scss,md}"

      # Turbo's default fan-out exhausts the runner's memory on this repo.
      - name: Type check
        run: pnpm exec turbo type-check --concurrency=2

      - name: Test
        run: pnpm exec turbo test --concurrency=2

      - name: Build
        run: pnpm build

      - name: Check the app was emitted
        run: test -f apps/dashboard/dist/index.html

  ember-build:
    name: Build Ember app
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ember Application
        uses: ./.github/actions/setup-ember-app

      - name: Build ember app
        working-directory: apps/irene
        run: npm run build:test

      # The test jobs run against this build rather than each making their own.
      - name: Upload built ember app
        uses: actions/upload-artifact@v7
        with:
          name: ember-dist
          path: apps/irene/dist

  ember-lint:
    name: Lint Ember app
    runs-on: [ubuntu-latest]
    defaults:
      run:
        working-directory: apps/irene
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ember Application
        uses: ./.github/actions/setup-ember-app

      # ember-cli-typescript reports type errors without failing the build.
      - name: Type check
        run: npm run type-check

      - name: Run Linting
        run: npm run lint

  ember-test:
    name: Ember ${{ matrix.tests.type }}
    needs: [ember-build]
    runs-on: [ubuntu-latest]
    defaults:
      run:
        working-directory: apps/irene
    strategy:
      fail-fast: false
      matrix:
        tests:
          - type: Unit Tests - Part 1
            commandArgs: --file-path='/irene/tests/unit*.js' --split=4 --partition=1 --parallel=4 --load-balance
          - type: Unit Tests - Part 2
            commandArgs: --file-path='/irene/tests/unit*.js' --split=4 --partition=2 --parallel=4 --load-balance
          - type: Unit Tests - Part 3
            commandArgs: --file-path='/irene/tests/unit*.js' --split=4 --partition=3 --parallel=4 --load-balance
          - type: Unit Tests - Part 4
            commandArgs: --file-path='/irene/tests/unit*.js' --split=4 --partition=4 --parallel=4 --load-balance
          - type: Acceptance Tests - Part 1
            commandArgs: --file-path='/irene/tests/acceptance*.js' --split=4 --partition=1 --parallel=4 --load-balance
          - type: Acceptance Tests - Part 2
            commandArgs: --file-path='/irene/tests/acceptance*.js' --split=4 --partition=2 --parallel=4 --load-balance
          - type: Acceptance Tests - Part 3
            commandArgs: --file-path='/irene/tests/acceptance*.js' --split=4 --partition=3 --parallel=4 --load-balance
          - type: Acceptance Tests - Part 4
            commandArgs: --file-path='/irene/tests/acceptance*.js' --split=4 --partition=4 --parallel=4 --load-balance
          - type: Integration Tests - Part 1
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=1 --parallel=12 --load-balance
          - type: Integration Tests - Part 2
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=2 --parallel=12 --load-balance
          - type: Integration Tests - Part 3
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=3 --parallel=12 --load-balance
          - type: Integration Tests - Part 4
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=4 --parallel=12 --load-balance
          - type: Integration Tests - Part 5
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=5 --parallel=12 --load-balance
          - type: Integration Tests - Part 6
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=6 --parallel=12 --load-balance
          - type: Integration Tests - Part 7
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=7 --parallel=12 --load-balance
          - type: Integration Tests - Part 8
            commandArgs: --file-path='/irene/tests/integration*.js' --split=8 --partition=8 --parallel=12 --load-balance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ember-dist
          path: apps/irene/dist

      - name: Setup Ember Application
        uses: ./.github/actions/setup-ember-app

      - name: Run ${{ matrix.tests.type }}
        run: npm run test:ember -- ${{ matrix.tests.commandArgs }} --path=dist --wmmf

      - name: Job Summary
        if: always()
        run: |
          echo "| Module | Total | Passed | Failed | Skipped | Duration (ms) |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY

          cat module-metadata-*.json | jq -r '.modules[] | "\(.moduleName | gsub("\\|"; "\\\\|")) | \(.total) | \(.passed) | \(.failed) | \(.skipped) | \(.duration) "' >> $GITHUB_STEP_SUMMARY

  bundle:
    name: Combined bundle
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Application
        uses: ./.github/actions/setup-app

      - name: Setup Ember Application
        uses: ./.github/actions/setup-ember-app

      # Builds both and stages the embed into the Ember app before it is built.
      - name: Build everything
        run: pnpm build:all

      - name: Check both apps were emitted
        run: |
          test -f apps/dashboard/dist/index.html
          test -f apps/irene/dist/index.html

      # The loader asks for this exact URL, which asset fingerprinting would rename.
      - name: Check the embed kept its name
        run: test -f apps/irene/dist/assets/embed/embed.js

      # Layered styles lose to the Ember app's unlayered ones, so the post-build
      # step unwraps them. If it stops running, Tailwind silently does nothing.
      - name: Check the embed styles are unlayered
        run: |
          test -f apps/dashboard/embed-dist/style.css
          ! grep -q "@layer" apps/dashboard/embed-dist/style.css

      # Element rules stay global: dropdowns and dialogs render outside the
      # container and would otherwise lose the reset they are drawn with.
      - name: Check the reset still reaches what renders outside the container
        run: |
          grep -q "data-react-root" apps/dashboard/embed-dist/style.css
          grep -qE "(^|\})button,input,select" apps/dashboard/embed-dist/style.css

      # The host's markup uses these class names for its own styling, so a
      # utility that is not confined restyles the host's pages.
      - name: Check no utility applies to the whole document
        run: |
          ! grep -qE "(^|\})\.(mb|mt|flex|hidden|p)-?[0-9a-z]*\{" apps/dashboard/embed-dist/style.css
