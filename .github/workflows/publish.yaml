name: Publish release image

# The production image. The tag is given when the run is started, so the
# artifact a cluster runs is named after the release it belongs to. Pushed to
# both registries for the same reason the Ember app is: ghcr for the hosted
# deployment, quay for on-premise.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish, e.g. 1.0.0'
        required: true
        type: string

env:
  GHCR_CONTAINER: ghcr.io/${{ github.repository }}
  QUAY_CONTAINER: quay.io/${{ github.repository }}

jobs:
  publish:
    name: Build the image and push it to ghcr and quay
    runs-on: [ubuntu-latest]
    environment:
      name: Production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Work out the image tag
        id: docker_tag
        env:
          TAG: ${{ inputs.tag }}
        run: echo "docker_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign in to quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_GITHUB_ACTION_PUSH_USERNAME }}
          password: ${{ secrets.QUAY_GITHUB_ACTION_PUSH_PASSWORD }}

      - name: Install earthly
        run: "sudo /bin/sh -c 'wget https://github.com/earthly/earthly/releases/download/v0.8.15/earthly-linux-amd64 -O /usr/local/bin/earthly && chmod +x /usr/local/bin/earthly'"

      - name: Check earthly runs
        run: earthly --version

      # Built once and pushed twice: the second run reuses the first's layers,
      # so both registries get the same image rather than two rebuilds.
      - name: Build and push the image to ghcr
        run: earthly --ci --push +publish --TAG=${{ steps.docker_tag.outputs.docker_tag }} --CONTAINER=${{ env.GHCR_CONTAINER }}

      - name: Push the same image to quay
        run: earthly --ci --push +publish --TAG=${{ steps.docker_tag.outputs.docker_tag }} --CONTAINER=${{ env.QUAY_CONTAINER }}

      - name: Tell Slack how it went
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: repo,workflow
          custom_payload: |
            {
              attachments: [{
                color: '${{ job.status }}' === 'success' ? 'good' : '${{ job.status }}' === 'failure' ? 'danger' : 'warning',
                text: `Release image ${{ job.status }}: ${{ env.GHCR_CONTAINER }}:${{ steps.docker_tag.outputs.docker_tag }} and ${{ env.QUAY_CONTAINER }}:${{ steps.docker_tag.outputs.docker_tag }}`,
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
